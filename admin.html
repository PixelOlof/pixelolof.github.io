<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PixelOlof – Admin</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,sans-serif;background:#070707;color:#fff}
.wrap{max-width:900px;margin:auto;padding:30px 16px}.card{background:#111;border:1px solid #292929;border-radius:18px;padding:24px;margin-bottom:18px;box-shadow:0 0 25px rgba(255,0,0,.08)}
h1{margin:0 0 8px}.red{color:#ff3030}.muted{color:#aaa}label{font-weight:700}
input{width:100%;padding:14px;margin:7px 0 12px;border-radius:10px;border:1px solid #333;background:#080808;color:#fff;font-size:16px}
button{border:0;border-radius:10px;padding:13px 18px;background:#e21b1b;color:#fff;font-weight:700;cursor:pointer;font-size:15px}
button:hover{background:#ff2929}.secondary{background:#252525}.secondary:hover{background:#333}.hidden{display:none!important}
.error,.success{margin-top:12px;padding:12px;border-radius:10px;white-space:pre-wrap;word-break:break-word}
.error{background:#351010;border:1px solid #7d2020;color:#ffb0b0}.success{background:#0d2b16;border:1px solid #1d7135;color:#a9f0ba}
.member{border:1px solid #2c2c2c;border-radius:12px;padding:15px;margin:10px 0;background:#0c0c0c}
.member strong{font-size:18px}.code{display:inline-block;margin-top:6px;padding:7px 9px;border-radius:8px;background:#181818;font-family:monospace;color:#ff5757}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
</style>
</head>
<body>
<div class="wrap">
<div id="loginCard" class="card">
<h1>🔐 <span class="red">PixelOlof</span> Admin</h1>
<p class="muted">Logga in för att hantera medlemmar.</p>
<label>Användarnamn</label>
<input id="username" type="text" placeholder="Användarnamn" autocomplete="username">
<label>Lösenord</label>
<input id="password" type="password" placeholder="Lösenord" autocomplete="current-password">
<button id="loginBtn">Logga in</button>
<div id="loginError" class="hidden"></div>
</div>

<div id="adminPanel" class="hidden">
<div class="card"><div class="topbar"><div><h1>⚙️ Adminpanel</h1><div class="muted">Inloggad som <b>PixelOlof</b></div></div><button id="logoutBtn" class="secondary">Logga ut</button></div></div>

<div class="card">
<h2>➕ Skapa medlem</h2>
<p class="muted">Skriv ett användarnamn. En unik medlemskod skapas automatiskt.</p>
<input id="newUsername" type="text" placeholder="T.ex. PixelMember02">
<button id="addBtn">Skapa medlem</button>
<div id="addMessage" class="hidden"></div>
</div>

<div class="card"><h2>👥 Medlemmar</h2><div id="membersList"><p class="muted">Laddar...</p></div></div>
</div>
</div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,collection,getDocs,setDoc,doc,deleteDoc,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


const firebaseConfig = {
  apiKey: "AIzaSyCtVV5fDpqiL-emhQ75dY_dTZtkhbYZCzk",
  authDomain: "pixelolof.firebaseapp.com",
  projectId: "pixelolof",
  storageBucket: "pixelolof.firebasestorage.app",
  messagingSenderId: "463793218153",
  appId: "1:463793218153:web:3b71016614d4aa9347b8f8"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);
const ADMIN_USERNAME="PixelOlof";
const ADMIN_EMAIL="pixeln10@tuta.io";

const loginCard=document.getElementById("loginCard");
const adminPanel=document.getElementById("adminPanel");
const loginError=document.getElementById("loginError");
const addMessage=document.getElementById("addMessage");
const membersList=document.getElementById("membersList");

function showError(el,msg){el.textContent=msg;el.className="error"}
function showSuccess(el,msg){el.textContent=msg;el.className="success"}

function makeCode(existing){
  const chars="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let code;
  do{
    let a="",b="";
    for(let i=0;i<4;i++) a+=chars[Math.floor(Math.random()*chars.length)];
    for(let i=0;i<4;i++) b+=chars[Math.floor(Math.random()*chars.length)];
    code="PX-"+a+"-"+b;
  }while(existing.has(code));
  return code;
}

async function migrateOldMembers(){
  const snap=await getDocs(collection(db,"members"));
  const docs=[];
  snap.forEach(d=>docs.push({id:d.id,data:d.data()}));

  for(const item of docs){
    const code=String(item.data.code||"").trim().toUpperCase();
    if(!code || item.id===code) continue;

    const target=doc(db,"members",code);
    await setDoc(target,{...item.data,code});
    await deleteDoc(doc(db,"members",item.id));
  }
}

async function loadMembers(){
  membersList.innerHTML="";
  await migrateOldMembers();

  const snap=await getDocs(collection(db,"members"));
  if(snap.empty){
    const p=document.createElement("p");
    p.className="muted";
    p.textContent="Inga medlemmar ännu.";
    membersList.appendChild(p);
    return;
  }

  const docs=[];
  snap.forEach(d=>docs.push(d.data()));
  docs.sort((a,b)=>String(a.username||"").localeCompare(String(b.username||"")));

  docs.forEach(data=>{
    const box=document.createElement("div");
    box.className="member";

    const name=document.createElement("strong");
    name.textContent=data.username||"Okänt användarnamn";
    box.appendChild(name);

    const codeEl=document.createElement("div");
    codeEl.className="code";
    codeEl.textContent=data.code||"Ingen kod";
    box.appendChild(codeEl);

    const row=document.createElement("div");
    row.className="row";

    const copy=document.createElement("button");
    copy.className="secondary";
    copy.textContent="Kopiera kod";
    copy.onclick=async()=>{
      try{
        await navigator.clipboard.writeText(data.code||"");
        copy.textContent="Kopierad ✓";
        setTimeout(()=>copy.textContent="Kopiera kod",1500);
      }catch{
        alert("Kunde inte kopiera automatiskt.");
      }
    };

    row.appendChild(copy);
    box.appendChild(row);
    membersList.appendChild(box);
  });
}

document.getElementById("loginBtn").onclick=async()=>{
  loginError.className="hidden";
  const username=document.getElementById("username").value.trim();
  const password=document.getElementById("password").value;

  if(username!==ADMIN_USERNAME)return showError(loginError,"Fel användarnamn.");
  if(!password)return showError(loginError,"Skriv ditt lösenord.");

  try{
    await signInWithEmailAndPassword(auth,ADMIN_EMAIL,password);
  }catch(e){
    console.error(e);
    showError(loginError,"Firebase-fel: "+e.code+"\n"+(e.message||""));
  }
};

document.getElementById("password").onkeydown=e=>{
  if(e.key==="Enter")document.getElementById("loginBtn").click();
};

document.getElementById("logoutBtn").onclick=()=>signOut(auth);

document.getElementById("addBtn").onclick=async()=>{
  addMessage.className="hidden";
  const username=document.getElementById("newUsername").value.trim();

  if(!username)return showError(addMessage,"Skriv ett användarnamn.");

  try{
    const snap=await getDocs(collection(db,"members"));
    const users=new Set();
    const codes=new Set();

    snap.forEach(d=>{
      const x=d.data();
      if(x.username)users.add(String(x.username).toLowerCase());
      if(x.code)codes.add(String(x.code).toUpperCase());
    });

    if(users.has(username.toLowerCase()))
      return showError(addMessage,"Det användarnamnet finns redan.");

    const code=makeCode(codes);

    await setDoc(doc(db,"members",code),{
      username,
      code,
      active:true,
      createdAt:serverTimestamp()
    });

    document.getElementById("newUsername").value="";
    showSuccess(addMessage,"Medlem skapad!\nAnvändarnamn: "+username+"\nKod: "+code);
    await loadMembers();
  }catch(e){
    console.error(e);
    showError(addMessage,"Kunde inte skapa medlem:\n"+e.code+"\n"+e.message);
  }
};

onAuthStateChanged(auth,async user=>{
  if(user){
    loginCard.classList.add("hidden");
    adminPanel.classList.remove("hidden");
    try{
      await loadMembers();
    }catch(e){
      console.error(e);
      membersList.innerHTML="";
      showError(membersList,"Kunde inte läsa medlemmarna:\n"+e.code+"\n"+e.message);
    }
  }else{
    loginCard.classList.remove("hidden");
    adminPanel.classList.add("hidden");
  }
});
</script>
</body>
</html>
