<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PixelOlof Admin</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#050505;
    color:#fff;
    min-height:100vh;
}

.container{
    width:min(900px,92%);
    margin:auto;
    padding:50px 0;
}

h1{
    text-align:center;
    color:#ff2020;
    font-size:40px;
    text-shadow:0 0 25px #ff2020;
}

.card{
    background:#111;
    border:1px solid #333;
    border-radius:18px;
    padding:25px;
    margin-top:25px;
    box-shadow:0 0 25px rgba(255,0,0,.12);
}

input{
    width:100%;
    padding:14px;
    margin:8px 0;
    border-radius:10px;
    border:1px solid #444;
    background:#080808;
    color:white;
    font-size:16px;
}

button{
    width:100%;
    padding:14px;
    margin-top:10px;
    border:0;
    border-radius:10px;
    background:#e50909;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#ff2424;
}

.hidden{
    display:none;
}

.member{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    padding:15px;
    margin:10px 0;
    background:#090909;
    border:1px solid #292929;
    border-radius:12px;
}

.copy{
    width:auto;
    margin:0;
    padding:9px 14px;
}

.code{
    color:#ff4a4a;
    font-weight:bold;
}

#status,#addStatus{
    text-align:center;
    margin-top:15px;
    color:#aaa;
    word-break:break-word;
}
</style>
</head>

<body>

<div class="container">

<h1>PIXEL OLOF ADMIN</h1>

<div id="loginBox" class="card">

<h2>🔐 Admin Login</h2>

<input
    id="username"
    placeholder="Användarnamn"
    autocomplete="username"
>

<input
    id="password"
    type="password"
    placeholder="Lösenord"
    autocomplete="current-password"
>

<button onclick="login()">LOGGA IN</button>

<div id="status"></div>

</div>


<div id="adminBox" class="hidden">

<div class="card">

<h2>🎟️ Lägg till medlemskod</h2>

<input
    id="newUsername"
    placeholder="Medlemsnamn"
>

<input
    id="newCode"
    placeholder="Medlemskod"
>

<button onclick="addMember()">
LÄGG TILL MEDLEM
</button>

<div id="addStatus"></div>

</div>


<div class="card">

<h2>👥 Medlemmar</h2>

<div id="membersList">
Laddar...
</div>

</div>


<div class="card">

<button onclick="logout()">
LOGGA UT
</button>

</div>

</div>

</div>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getAuth,
    signInWithEmailAndPassword,
    signOut
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
    getFirestore,
    collection,
    getDocs,
    addDoc
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


const firebaseConfig = {

    apiKey: "AIzaSyCtVV5fDpqiL-emhQ75yD_dTZtkhbYZCzk",

    authDomain: "pixelolof.firebaseapp.com",

    projectId: "pixelolof",

    storageBucket: "pixelolof.firebasestorage.app",

    messagingSenderId: "463793218153",

    appId: "1:463793218153:web:3b71016614d4aa9347b8f8"

};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);


/* =========================
   LOGGA IN
========================= */

window.login = async function(){

    const username =
        document.getElementById("username").value.trim();

    const password =
        document.getElementById("password").value;

    const status =
        document.getElementById("status");


    if(username !== "PixelOlof"){

        status.textContent =
            "Fel användarnamn.";

        return;
    }


    if(!password){

        status.textContent =
            "Skriv ditt lösenord.";

        return;
    }


    status.textContent =
        "Loggar in...";


    try{

        await signInWithEmailAndPassword(
            auth,
            "pixeln10@tuta.io",
            password
        );


        document
            .getElementById("loginBox")
            .classList.add("hidden");


        document
            .getElementById("adminBox")
            .classList.remove("hidden");


        status.textContent = "";


        await loadMembers();


    }catch(error){

        console.error("Firebase error:", error);

        status.textContent =
            "Firebase-fel: " + error.code;

    }

};


/* =========================
   LOGGA UT
========================= */

window.logout = async function(){

    try{

        await signOut(auth);

        document
            .getElementById("adminBox")
            .classList.add("hidden");

        document
            .getElementById("loginBox")
            .classList.remove("hidden");

        document
            .getElementById("password")
            .value = "";

        document
            .getElementById("status")
            .textContent = "";

    }catch(error){

        console.error(error);

    }

};


/* =========================
   VISA MEDLEMMAR
========================= */

async function loadMembers(){

    const list =
        document.getElementById("membersList");


    list.innerHTML =
        "Laddar medlemmar...";


    try{

        const snapshot =
            await getDocs(
                collection(db,"members")
            );


        list.innerHTML = "";


        if(snapshot.empty){

            list.innerHTML =
                "Inga medlemmar ännu.";

            return;
        }


        snapshot.forEach(docSnap => {

            const data =
                docSnap.data();


            const div =
                document.createElement("div");

            div.className =
                "member";


            const info =
                document.createElement("div");


            const name =
                document.createElement("b");

            name.textContent =
                data.username || "";


            const br =
                document.createElement("br");


            const code =
                document.createElement("span");

            code.className =
                "code";

            code.textContent =
                data.code || "";


            info.appendChild(name);

            info.appendChild(br);

            info.appendChild(code);


            const button =
                document.createElement("button");

            button.className =
                "copy";

            button.textContent =
                "KOPIERA";


            button.onclick = function(){

                copyCode(
                    data.username,
                    data.code
                );

            };


            div.appendChild(info);

            div.appendChild(button);

            list.appendChild(div);

        });


    }catch(error){

        console.error(
            "Firestore error:",
            error
        );


        list.innerHTML =
            "❌ Kunde inte läsa medlemslistan.<br>" +
            "Firebase-fel: " +
            error.code;

    }

}


/* =========================
   LÄGG TILL MEDLEM
========================= */

window.addMember = async function(){

    const username =
        document
            .getElementById("newUsername")
            .value
            .trim();


    const code =
        document
            .getElementById("newCode")
            .value
            .trim();


    const status =
        document
            .getElementById("addStatus");


    if(!username || !code){

        status.textContent =
            "Fyll i både namn och kod.";

        return;
    }


    try{

        await addDoc(
            collection(db,"members"),
            {

                username: username,

                code: code,

                active: true,

                createdAt: new Date()

            }
        );


        status.textContent =
            "✅ Medlem tillagd!";


        document
            .getElementById("newUsername")
            .value = "";


        document
            .getElementById("newCode")
            .value = "";


        await loadMembers();


    }catch(error){

        console.error(
            "Firestore error:",
            error
        );


        status.textContent =
            "❌ Firebase-fel: " +
            error.code;

    }

};


/* =========================
   KOPIERA
========================= */

window.copyCode = async function(
    username,
    code
){

    const text =
        "Användarnamn: " +
        username +
        "\nKod: " +
        code;


    try{

        await navigator.clipboard.writeText(
            text
        );

        alert("Kopierat! 📋");

    }catch(error){

        alert(
            "Kunde inte kopiera. " +
            "Användarnamn: " +
            username +
            " Kod: " +
            code
        );

    }

};

</script>

</body>
</html>
